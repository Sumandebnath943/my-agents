# .github/workflows/10-linkedin-document-spike.yml
# MANUAL ONLY — no schedule, so this adds zero scheduled events to a fleet GitHub is already
# throttling. Answers one question: does LinkedIn accept a PDF (carousel) upload on w_member_social?
# Documents are a different endpoint and a different entitlement from images, so the image spike's
# green result proves nothing here. PUBLISHES NOTHING — it stops before the step that creates a post.
name: LinkedIn · Document Upload Spike
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 10-linkedin-document-spike-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node scripts/linkedin-document-spike.mjs
        env:
          AGENT_NAME: linkedin
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
