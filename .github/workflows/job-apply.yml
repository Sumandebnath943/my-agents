# .github/workflows/job-apply.yml
# Assisted apply — fills an ATS application in a headless browser.
#
# NEVER RUNS ON A SCHEDULE, BY DESIGN. It is dispatched one role at a time, and `mode: submit` is
# only ever triggered by the Submit button on the dashboard, after a human has looked at the
# screenshot of the filled form. The driver additionally refuses to submit anything that is not
# already in apply_state='prepared'. See agents/job-agent/apply/run.js.
#
# Playwright is installed here rather than in package.json so the other workflows' `npm ci` stays
# lean (same pattern as 30-browser.yml).
name: Assisted Apply
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "jobs.id of the role to apply to"
        required: true
        type: string
      mode:
        description: "prepare = fill + screenshot only · submit = send it (requires a prepared application)"
        required: true
        default: prepare
        type: choice
        options: [prepare, submit]
permissions:
  contents: read
concurrency:
  group: job-apply-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    # npm ci + a Chromium download + a heavy form can genuinely take a while; 15 was tight enough
    # that a slow run could be killed mid-fill and look like a hang.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm i playwright --no-save && npx playwright install --with-deps chromium
      - run: node agents/job-agent/apply/run.js --id "${{ inputs.job_id }}" --mode "${{ inputs.mode }}"
        env:
          AGENT_NAME: job-apply
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APPLY_ANSWERS: ${{ secrets.APPLY_ANSWERS }}
          CV_TEXT: ${{ secrets.CV_TEXT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESUME_STORAGE_PATH: ${{ secrets.RESUME_STORAGE_PATH }}

      # THE DEAD-MAN SWITCH.
      # run.js writes 'preparing' before launching the browser and a final state at the end — but a
      # process that is KILLED (job timeout, runner OOM, cancelled run, a crash before the handler)
      # never reaches that final write, so the role sat on "Filling the form…" forever with the
      # retry blocked. The WORKFLOW knows the job failed even when the process couldn't say so.
      # Inputs go through env, never interpolated into the shell — see the CI injection hardening.
      - name: Report failure back to the dashboard
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JOB_ID: ${{ inputs.job_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X PATCH "${SUPABASE_URL}/rest/v1/jobs?id=eq.${JOB_ID}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data "$(printf '{"apply_state":"failed","apply_error":"The apply run failed before it could report back. Log: %s"}' "${RUN_URL}")" \
            || echo "could not report failure back (the dashboard's 20-minute staleness rule still unblocks it)"
