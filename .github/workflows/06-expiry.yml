# .github/workflows/06-expiry.yml
name: Expiry Watcher
on:
  schedule:
    - cron: "11 11 * * 1"    # weekly, Monday ~16:41 IST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 06-expiry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/06-expiry/index.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DIGEST: "1"   # always send the weekly countdown (not just on warnings)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
