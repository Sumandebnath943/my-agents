# .github/workflows/30-browser.yml
# Web Watch — headless-browser page watcher (Playwright + Gemini vision). Alerts on change only.
# Playwright is installed HERE, not in package.json, so the other 38 workflows' `npm ci` stays lean.
# Dormant until you add targets to kv `browser:watchlist`.
name: Web Watch
on:
  schedule:
    - cron: "40 7 * * *"   # once a day
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 30-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      # Run gate — has the dispatcher already covered this scheduled slot? Only `schedule`
      # events are gated; a dispatch or a human pressing Run always proceeds. continue-on-error
      # is REQUIRED: without it a failed gate would stop the steps below, which is fail-CLOSED.
      - id: gate
        continue-on-error: true
        run: node tools/run-gate.mjs
        env:
          GATE_AGENT: ${{ github.workflow }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_CRON: ${{ github.event.schedule }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - run: npm i playwright --no-save && npx playwright install --with-deps chromium
        if: steps.gate.outcome == 'failure' || steps.gate.outputs.skip != 'true'
      - run: node agents/30-browser/index.js
        if: steps.gate.outcome == 'failure' || steps.gate.outputs.skip != 'true'
        env:
          AGENT_NAME: browser
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The `vision` chain is gemini -> openai, and vision calls CANNOT degrade to text providers
          # (Mistral/OpenRouter can't read images). Without this key the agent had exactly one
          # provider and no fallback, so a single Gemini 429 failed the whole run. OpenAI is SECOND
          # in the chain, so this adds no traffic — it is only reached once Gemini has already failed.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Mark the slot done only on success. An unconfirmed claim means the run failed, so the
      # slot stays open and GitHub's later delivery is allowed through rather than skipped.
      - name: confirm slot
        if: always() && job.status == 'success' && (steps.gate.outputs.claimed == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: node tools/run-gate.mjs --confirm
        env:
          GATE_AGENT: ${{ github.workflow }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_CRON: ${{ github.event.schedule }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}