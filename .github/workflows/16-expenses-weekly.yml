# .github/workflows/16-expenses-weekly.yml
# NOTE: receipt CAPTURE is handled by the Inbox Router. This is the weekly spend summary.
name: Expenses Weekly Summary
on:
  schedule:
    - cron: "49 10 * * 0"    # Sundays ~16:19 IST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 16-expenses-weekly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/16-expenses/weekly.js
        env:
          AGENT_NAME: expenses
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
