# .github/workflows/02-supabase-keepalive.yml
name: Supabase Keep-Alive
on:
  schedule:
    - cron: "0 3 * * *"   # daily, well within the 7-day window
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 02-supabase-keepalive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/02-supabase-keepalive/index.js
        env:
          SUPABASE_PROJECTS: ${{ secrets.SUPABASE_PROJECTS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
