# .github/workflows/32-integrity.yml
# Integrity Probe — the silent-success detector. Checks that tables which SHOULD be receiving rows
# actually are, and that no vector store is holding rows without their embedding (the failure shape
# behind the 2026-07 ECHO/MAS outage). No LLM, no cost — just a handful of Supabase reads.
# Quiet unless something is wrong; run it manually with DIGEST=1 for an all-clear.
name: Integrity Probe
on:
  schedule:
    - cron: "50 6 * * *"   # daily 12:20 IST — off the hour, away from the other crons
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 32-integrity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      # Run gate — has the dispatcher already covered this scheduled slot? Only `schedule`
      # events are gated; a dispatch or a human pressing Run always proceeds. continue-on-error
      # is REQUIRED: without it a failed gate would stop the steps below, which is fail-CLOSED.
      - id: gate
        continue-on-error: true
        run: node tools/run-gate.mjs
        env:
          GATE_AGENT: ${{ github.workflow }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_CRON: ${{ github.event.schedule }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - run: node agents/32-integrity/index.js
        if: steps.gate.outcome == 'failure' || steps.gate.outputs.skip != 'true'
        env:
          AGENT_NAME: integrity
          # Manual run = you want confirmation, so always send the all-clear. Scheduled runs stay
          # quiet unless something is actually wrong. (Deliberately not a workflow input: a
          # `type: boolean` input arrives as the STRING "false" via github.event.inputs, which is
          # truthy in GitHub expressions — an easy way to make this noisy by accident.)
          DIGEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Mark the slot done only on success. An unconfirmed claim means the run failed, so the
      # slot stays open and GitHub's later delivery is allowed through rather than skipped.
      - name: confirm slot
        if: always() && job.status == 'success' && (steps.gate.outputs.claimed == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: node tools/run-gate.mjs --confirm
        env:
          GATE_AGENT: ${{ github.workflow }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_CRON: ${{ github.event.schedule }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}