# .github/workflows/10-linkedin-draft.yml
name: LinkedIn Draft
on:
  schedule:
    - cron: "30 1 * * *"   # 7:00 AM IST daily — curates the day's news list to pick from
  workflow_dispatch:
    inputs:
      edit_id:
        description: "Post id to revise (leave blank for a fresh draft)"
        required: false
      edit_note:
        description: "Edit instructions"
        required: false
      news_idx:
        description: "Picked news index, or 'auto' (blank = curate today's list)"
        required: false
      batch_id:
        description: "News batch id (staleness guard)"
        required: false
      regen_id:
        description: "Post id to regenerate with a different angle"
        required: false
permissions:
  contents: read
concurrency:
  group: 10-linkedin-draft-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/10-linkedin/10a-draft.js
        env:
          AGENT_NAME: linkedin
          EDIT_ID: ${{ github.event.inputs.edit_id }}
          EDIT_NOTE: ${{ github.event.inputs.edit_note }}
          NEWS_IDX: ${{ github.event.inputs.news_idx }}
          BATCH_ID: ${{ github.event.inputs.batch_id }}
          REGEN_ID: ${{ github.event.inputs.regen_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
