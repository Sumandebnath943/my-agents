# .github/workflows/15-journal-prompt.yml
# NOTE: reply CAPTURE is handled by the Inbox Router. This just sends the evening nudge.
name: Journal Evening Prompt
on:
  schedule:
    - cron: "29 16 * * *"   # ~10:00 PM IST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 15-journal-prompt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/15-journal/prompt.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AGENT_NAME: journal
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
