# .github/workflows/17-habits-weekly.yml
# NOTE: habit-log CAPTURE is handled by the Inbox Router. This is the fortnightly insight.
name: Habits Weekly Insight
on:
  schedule:
    - cron: "30 3 * * 0"    # Sundays ~9:00 AM IST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 17-habits-weekly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/17-habits/weekly.js
        env:
          AGENT_NAME: habits
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
