# .github/workflows/build-compass.yml
# Collector runs 3x/day accumulating demand into demand_items; the Decider runs weekly (day 7)
# and turns the accumulated week into a scored Top-7 build shortlist.
name: Build Compass
on:
  schedule:
    - cron: "0 3,11,19 * * *"   # collect ~3x/day (08:30 / 16:30 / 00:30 IST)
    - cron: "30 3 * * 1"        # decide weekly — Monday ~09:00 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "collect or decide"
        required: false
        default: "decide"
permissions:
  contents: read
concurrency:
  group: build-compass-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.schedule == '0 3,11,19 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'collect')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/build-compass/collect.js
        env:
          AGENT_NAME: build-compass
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  decide:
    if: github.event.schedule == '30 3 * * 1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'collect')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/build-compass/decide.js
        env:
          AGENT_NAME: build-compass
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
