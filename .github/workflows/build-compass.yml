# .github/workflows/build-compass.yml
# Collector runs 3x/day accumulating demand into demand_items; the Decider runs weekly (day 7)
# and turns the accumulated week into a scored Top-7 build shortlist.
name: Build Compass
on:
  schedule:
    - cron: "49 6,11,19 * * *"   # collect ~3x/day (12:19 / 16:49 / 00:49 IST)
    - cron: "24 6 * * 1"        # decide weekly — Monday ~11:54 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "collect or decide"
        required: false
        default: "decide"
permissions:
  contents: read
concurrency:
  group: build-compass-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.schedule == '49 6,11,19 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'collect')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      # Run gate — has the dispatcher already covered this scheduled slot? Only `schedule`
      # events are gated; a dispatch or a human pressing Run always proceeds. continue-on-error
      # is REQUIRED: without it a failed gate would stop the steps below, which is fail-CLOSED.
      - id: gate
        continue-on-error: true
        run: node tools/run-gate.mjs
        env:
          GATE_AGENT: ${{ github.workflow }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_CRON: ${{ github.event.schedule }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - run: node agents/build-compass/collect.js
        if: steps.gate.outcome == 'failure' || steps.gate.outputs.skip != 'true'
        env:
          AGENT_NAME: build-compass
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Mark the slot done only on success. An unconfirmed claim means the run failed, so the
      # slot stays open and GitHub's later delivery is allowed through rather than skipped.
      - name: confirm slot
        if: always() && job.status == 'success' && (steps.gate.outputs.claimed == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: node tools/run-gate.mjs --confirm
        env:
          GATE_AGENT: ${{ github.workflow }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_CRON: ${{ github.event.schedule }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  decide:
    if: github.event.schedule == '24 6 * * 1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'collect')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      # Run gate — has the dispatcher already covered this scheduled slot? Only `schedule`
      # events are gated; a dispatch or a human pressing Run always proceeds. continue-on-error
      # is REQUIRED: without it a failed gate would stop the steps below, which is fail-CLOSED.
      - id: gate
        continue-on-error: true
        run: node tools/run-gate.mjs
        env:
          GATE_AGENT: ${{ github.workflow }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_CRON: ${{ github.event.schedule }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - run: node agents/build-compass/decide.js
        if: steps.gate.outcome == 'failure' || steps.gate.outputs.skip != 'true'
        env:
          AGENT_NAME: build-compass
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}

      # Mark the slot done only on success. An unconfirmed claim means the run failed, so the
      # slot stays open and GitHub's later delivery is allowed through rather than skipped.
      - name: confirm slot
        if: always() && job.status == 'success' && (steps.gate.outputs.claimed == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: node tools/run-gate.mjs --confirm
        env:
          GATE_AGENT: ${{ github.workflow }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_CRON: ${{ github.event.schedule }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}