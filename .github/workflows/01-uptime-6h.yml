# .github/workflows/01-uptime-6h.yml
# Periodic full status report every 6 hours — always sends.
name: Uptime Sentinel (6-Hourly)
on:
  schedule:
    # Every 6 hours (00/06/12/18 UTC). NOT :03 — team-manager.yml's health ping is "3 */2 * * *",
    # which put both on the same minute four times a day. :11 sits 4 min clear of that and of
    # 31-selfheal.yml's ":15", at all four hours.
    - cron: "11 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 01-uptime-6h-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/01-uptime/index.js
        env:
          AGENT_NAME: uptime
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DIGEST: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
