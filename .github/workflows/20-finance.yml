# .github/workflows/20-finance.yml
name: Finance Ledger
on:
  schedule:
    - cron: "*/20 * * * *"    # ingest new SMS every 20 min
    - cron: "30 3 * * 0"      # weekly digest Sun (uses default = week)
    - cron: "30 3 1 * *"      # monthly digest on the 1st
  workflow_dispatch:
jobs:
  ingest:
    if: github.event.schedule == '*/20 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/20-finance/index.js
        env: &fin
          FINANCE_BOT_TOKEN: ${{ secrets.FINANCE_BOT_TOKEN }}
          FINANCE_CHAT_ID: ${{ secrets.FINANCE_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
  weekly:
    if: github.event.schedule == '30 3 * * 0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/20-finance/digest.js week
        env: *fin
  monthly:
    if: github.event.schedule == '30 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/20-finance/digest.js month
        env: *fin
