# .github/workflows/20-finance.yml
# Ingest is handled by the dashboard endpoint /api/finance-sms (MacroDroid POSTs there in
# real time). This workflow only sends the weekly + monthly spend digests.
name: Finance Ledger
on:
  schedule:
    - cron: "30 3 * * 0"      # weekly digest Sun (uses default = week)
    - cron: "30 3 1 * *"      # monthly digest on the 1st
  workflow_dispatch:
    inputs:
      period:
        description: "week or month (manual digest)"
        required: false
        default: "week"
jobs:
  weekly:
    if: github.event.schedule == '30 3 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/20-finance/digest.js ${{ github.event.inputs.period || 'week' }}
        env:
          AGENT_NAME: finance
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
  monthly:
    if: github.event.schedule == '30 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/20-finance/digest.js month
        env:
          AGENT_NAME: finance
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
