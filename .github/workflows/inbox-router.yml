# .github/workflows/inbox-router.yml
# DEPRECATED as the live poller — replaced by the Telegram WEBHOOK (dashboard /api/telegram
# → telegram-webhook.yml). Polling can't run while a webhook is set (Telegram 409).
# Kept as manual-only for fallback/testing. To go back to polling, delete the webhook first.
name: Inbox Router (deprecated poller)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inbox-router-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/inbox-router/index.js
        env:
          AGENT_NAME: migi
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
