# .github/workflows/01-uptime-watch.yml
# Frequent watch every 2 hours — NO DIGEST flag, so it only pings when a site is down.
# Was */30: GitHub throttles high-frequency crons and a 137-events/day fleet built a growing
# backlog (12h late by 2026-08-28). Anything below 2-hourly buys nothing — see SECURITY_POSTURE.md §8.
name: Uptime Sentinel (Watch)
on:
  schedule:
    - cron: "0 */2 * * *" # every 2 hours
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 01-uptime-watch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/01-uptime/index.js
        env:
          AGENT_NAME: uptime
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
