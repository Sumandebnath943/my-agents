# .github/workflows/17-habits-checkin.yml
# Daily health check-ins. Two schedules, one script — the cron that fired decides the mode.
# Both are conditional: nothing is sent if the data is already logged, so the nudge never nags.
name: Habits Check-in
on:
  schedule:
    - cron: "35 1 * * *"    # 07:00 IST — morning: how did you sleep?
    - cron: "21 16 * * *"    # 21:30 IST — evening: productivity + mood (before the 22:00 journal prompt)
  workflow_dispatch:
    inputs:
      mode:
        # ONE job here, not two — the mode is an env expression, not an `if:`. A dispatch has no
        # github.event.schedule, so it always fell through to "morning": rescuing a dropped
        # EVENING check-in would have asked "how did you sleep?" at 10pm. Blank keeps a bare
        # dispatch and every scheduled run behaving exactly as before.
        description: "morning or evening (blank = follow the schedule)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: 17-habits-checkin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      # Run gate — has the dispatcher already covered this scheduled slot? Only `schedule`
      # events are gated; a dispatch or a human pressing Run always proceeds. continue-on-error
      # is REQUIRED: without it a failed gate would stop the steps below, which is fail-CLOSED.
      - id: gate
        continue-on-error: true
        run: node tools/run-gate.mjs
        env:
          GATE_AGENT: ${{ github.workflow }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_CRON: ${{ github.event.schedule }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - run: node agents/17-habits/checkin.js
        if: steps.gate.outcome == 'failure' || steps.gate.outputs.skip != 'true'
        env:
          AGENT_NAME: habits
          # github.event.schedule holds the cron string that triggered this run; a manual dispatch
          # has none, so it falls through to the morning prompt. An explicit `mode` input wins over
          # both — that is how the dispatcher rescues a dropped evening check-in. An empty string
          # is falsy in GitHub expressions and github.event.inputs is null on a schedule event, so
          # a bare dispatch and every scheduled run are unaffected.
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '21 16 * * *' && 'evening' || 'morning') }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Mark the slot done only on success. An unconfirmed claim means the run failed, so the
      # slot stays open and GitHub's later delivery is allowed through rather than skipped.
      - name: confirm slot
        if: always() && job.status == 'success' && (steps.gate.outputs.claimed == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: node tools/run-gate.mjs --confirm
        env:
          GATE_AGENT: ${{ github.workflow }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_CRON: ${{ github.event.schedule }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}