# .github/workflows/17-habits-checkin.yml
# Daily health check-ins. Two schedules, one script — the cron that fired decides the mode.
# Both are conditional: nothing is sent if the data is already logged, so the nudge never nags.
name: Habits Check-in
on:
  schedule:
    - cron: "30 1 * * *"    # 07:00 IST — morning: how did you sleep?
    - cron: "0 16 * * *"    # 21:30 IST — evening: productivity + mood (before the 22:00 journal prompt)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 17-habits-checkin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node agents/17-habits/checkin.js
        env:
          AGENT_NAME: habits
          # github.event.schedule holds the cron string that triggered this run; a manual dispatch
          # has none, so it falls through to the morning prompt.
          MODE: ${{ github.event.schedule == '0 16 * * *' && 'evening' || 'morning' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
